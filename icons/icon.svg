<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="45%" stop-color="#dc2626"/>
      <stop offset="85%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>

    <!-- Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Beacon Light Gradient -->
    <linearGradient id="beaconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>

    <!-- Ray Beam Radial Gradient -->
    <radialGradient id="rayGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#fef08a" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Base -->
  <rect width="512" height="512" rx="118" fill="url(#bgGrad)"/>

  <!-- Subtle Top Rim Highlight -->
  <path d="M118 4 C50 4 4 50 4 118 L4 180 C40 80 120 20 256 20 C392 20 472 80 508 180 L508 118 C508 50 462 4 394 4 Z" fill="#ffffff" opacity="0.15"/>

  <!-- Outer Pulse Ring -->
  <circle cx="256" cy="235" r="195" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" stroke-dasharray="12 12"/>
  <circle cx="256" cy="235" r="170" fill="url(#rayGlow)"/>

  <!-- Central Emergency Shield -->
  <g filter="url(#dropShadow)">
    <!-- Shield Outer -->
    <path d="M256 75 C345 75 395 105 395 185 C395 290 295 375 256 405 C217 375 117 290 117 185 C117 105 167 75 256 75 Z" fill="url(#shieldGrad)"/>
    <!-- Shield Inner Rim -->
    <path d="M256 88 C334 88 378 114 378 185 C378 276 290 354 256 383 C222 354 134 276 134 185 C134 114 178 88 256 88 Z" fill="#ffffff"/>
  </g>

  <!-- Glowing Siren Beacon (Light Dome) -->
  <g transform="translate(256, 175)">
    <!-- Base Plate -->
    <rect x="-65" y="42" width="130" height="14" rx="7" fill="#334155"/>
    <rect x="-55" y="38" width="110" height="6" rx="3" fill="#64748b"/>

    <!-- Light Rays -->
    <line x1="0" y1="-85" x2="0" y2="-65" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
    <line x1="-60" y1="-65" x2="-45" y2="-50" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
    <line x1="60" y1="-65" x2="45" y2="-50" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
    <line x1="-80" y1="-20" x2="-60" y2="-15" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
    <line x1="80" y1="-20" x2="60" y2="-15" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>

    <!-- Siren Dome Outer Glow -->
    <path d="M-45 38 C-45 -25 45 -25 45 38 Z" fill="url(#beaconGrad)" filter="url(#glow)"/>
    <!-- Siren Dome Core -->
    <path d="M-42 38 C-42 -20 42 -20 42 38 Z" fill="url(#beaconGrad)"/>

    <!-- Beacon Specular Highlight -->
    <path d="M-28 32 C-28 -5 0 -16 18 -10 C9 -14 -12 -5 -15 32 Z" fill="#ffffff" opacity="0.65"/>
    <ellipse cx="-8" cy="-5" rx="8" ry="14" fill="#ffffff" opacity="0.5" transform="rotate(-20 -8 -5)"/>
  </g>

  <!-- Emergency 112 Phone Handset inside Shield -->
  <g transform="translate(256, 260) scale(1.15)">
    <!-- Phone Receiver Silhouette in Solid Crimson -->
    <path d="M-38 -15 C-42 -7 -38 12 -22 28 C-6 44 13 48 21 44 L32 33 C36 29 36 22 31 18 L19 9 C15 6 9 7 6 11 L3 15 C-4 11 -11 4 -15 -3 L-11 -6 C-7 -9 -6 -15 -9 -19 L-18 -31 C-22 -36 -29 -36 -33 -32 Z" fill="#dc2626"/>
    <!-- Phone Highlight Detail -->
    <path d="M-34 -12 C-38 -5 -35 10 -21 24 C-8 38 7 42 15 39 L24 30 C26 28 26 24 23 21 L13 13 C11 11 7 12 5 15 L1 20 C-9 14 -14 9 -20 -1 L-15 -5 C-12 -7 -11 -11 -13 -14 L-21 -24 C-24 -27 -28 -27 -30 -25 Z" fill="#ef4444"/>
  </g>

  <!-- Lifeline ECG Pulse Line across lower shield -->
  <path d="M175 320 L210 320 L222 300 L238 342 L254 285 L268 335 L280 310 L292 320 L337 320" fill="none" stroke="#dc2626" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Badge Text: 112 EMERGENCY -->
  <rect x="156" y="420" width="200" height="48" rx="24" fill="#ffffff" filter="url(#dropShadow)"/>
  <text x="256" y="452" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="25" fill="#dc2626" letter-spacing="2">112 SOS</text>
</svg>